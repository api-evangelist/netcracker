components:
  schemas:
    ApiKey:
      title: ApiKey
      type: object
      required:
      - id
      - name
      properties:
        id:
          description: ApiKey unique identifier
          type: string
        name:
          description: ApiKey name
          type: string
    Package:
      description: Simple package object, without content and dependencies
      type: object
      title: Package
      required:
      - packageId
      - alias
      - kind
      - name
      - isFavorite
      - defaultRole
      properties:
        packageId:
          description: Package unique string identifier (full alias)
          type: string
        alias:
          type: string
          description: Package short alias (abbreviation)
          maxLength: 10
          pattern: ^[a-zA-Z0-9-_]
        parentId:
          description: Parent package ID
          type: string
        kind:
          description: Package kind
          type: string
          enum:
          - workspace
          - group
          - package
          - dashboard
        name:
          description: Name of the package
          type: string
        description:
          description: Common description of the package
          type: string
        isFavorite:
          description: Sign of the favorite package for the caller user
          type: boolean
          default: false
        serviceName:
          description: Service name that package belongs to. Should be equal to service deployment name in kubernetes.
          type: string
        permissions:
          type: array
          description: List of user permissions applicable to the package.
          items:
            $ref: '#/components/schemas/Permission'
          example:
          - read
          - create_and_update_package
          - delete_package
        defaultRole:
          description: Default role of the package.
          type: string
        releaseVersionPattern:
          description: Release version mask. Value shall be inherited from parent group with the ability to override it.
          type: string
        excludeFromSearch:
          description: 'If true, the package (including child packages) will be ignored by global search.

            Changing the value of the parent package will change the value of all child packages.

            A child package cannot have a negative value if the parent package has a positive value. The default value for a newly created package is equal to the value from the parent package.

            '
          type: boolean
        restGroupingPrefix:
          description: 'Regular expression used as criteria for grouping operations.

            Groups for the package version are calculated during publication of this version.

            '
          type: string
          example: /api/v1/{group}/
    VersionStatusEnum:
      description: Package version status
      type: string
      enum:
      - draft
      - release
      - archived
    PackageList:
      description: Base package object for parents list.
      type: object
      title: PackageList
      properties:
        packageId:
          description: Package unique string identifier (full alias)
          type: string
        alias:
          type: string
          description: Package short alias (abbreviation)
          maxLength: 10
          pattern: ^[a-zA-Z0-9-_]
        parentId:
          description: Parent package ID
          type: string
        kind:
          description: Package kind
          type: string
          enum:
          - workspace
          - group
          - package
          - dashboard
        name:
          description: Name of the package
          type: string
    PackageExportConfigUpdate:
      description: Parameters for update of package export config.
      type: object
      properties:
        allowedOasExtensions:
          description: 'List of OAS extensions that shall be preserverd when user exports OpenAPI specification(s) with remove OAS extensions option.

            List of OAS extensions is unique within current package.\

            The full list of direct extensions must be included in the request, as the request replaces the items in the array rather than adding to them.

            '
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^x-
          example:
          - x-internal-info
          - x-design-details
    ActivityHistoryPrincipal:
      description: User, API key or automatic job
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/User'
        - $ref: '#/components/schemas/ApiKey'
        - $ref: '#/components/schemas/Job'
      - type: object
        required:
        - type
        properties:
          type:
            description: Identifies whether principal is user, API key or automatic job
            type: string
            enum:
            - user
            - apiKey
            - job
    User:
      description: Represents an APIHUB user with identity and profile information returned by API endpoints.
      type: object
      required:
      - id
      properties:
        id:
          description: Unique user login (username) used to authenticate the user.
          type: string
          example: user1221
        name:
          description: Name of the user
          type: string
          example: John Doe
        email:
          description: Email address of the user
          type: string
          format: email
          example: john.doe@example.com
        avatarUrl:
          description: URL of the user avatar image.
          type: string
          format: URL
    PackageUpdate:
      description: Parameters for the package update. Not changed parameters must not be transmitted. Parameters, required in creation, must not be empty if transmitted.
      type: object
      properties:
        name:
          description: Name of the package
          type: string
        description:
          description: Common description of the package
          type: string
        serviceName:
          description: 'Service name that package belongs to. Should be equal to service deployment name in kubernetes.

            Parameter may be changed (filled in) only it was empty in creation. Otherwise, the 400 error will be returned.

            '
          type: string
        defaultRole:
          description: Default role of the package.
          type: string
        defaultReleaseVersion:
          description: 'Default release version for the package.

            Only `release` version may be placed as default. Return the error otherwise.

            '
          type: string
          example: '2023.1'
        releaseVersionPattern:
          description: Release version mask. Value shall be inherited from parent group with the ability to override it.
          type: string
        excludeFromSearch:
          description: 'If true, the package (including child packages) will be ignored by global search.

            Changing the value of the parent package will change the value of all child packages.

            A child package cannot have a negative value if the parent package has a positive value. The default value for a newly created package is equal to the value from the parent package.

            '
          type: boolean
        restGroupingPrefix:
          description: Regular expression used as criteria for grouping operations.
          type: string
    ErrorResponse:
      description: Standard error response returned for failed requests. Includes HTTP status, internal error code, human-readable message, optional message parameters, and optional debug details (non-production only).
      type: object
      properties:
        status:
          description: HTTP status code as an integer; expected to match the actual HTTP response status.
          type: number
        code:
          description: Internal string error code. Mandatory in response.
          type: string
        message:
          description: Human-readable error message describing what went wrong; intended for diagnostics and safe client display.
          type: string
        params:
          type: object
          description: Optional key/value parameters used to format or contextualize the error message (for example, identifiers or field names).
          example:
            id: 12345
            type: string
        debug:
          description: Optional debug details (for example, stack traces). Returned only in development/test environments when verbose logging is enabled; do not rely on this field in production because it may contain sensitive data.
          type: string
      required:
      - status
      - code
      - message
    ChangeSummary:
      description: 'Numbers of changes between the current and previous published version.

        '
      type: object
      properties:
        breaking:
          description: Number of changes, breaking the backward compatibility.
          type: integer
          default: 0
        semi-breaking:
          description: Number of changes, breaking the backward compatibility in a legal way. For example, deleting correctly deprecated endpoint.
          type: integer
          default: 0
        deprecated:
          description: Number of deprecated endpoints.
          type: integer
          default: 0
        non-breaking:
          description: Number of non-breaking changes.
          type: integer
          default: 0
        annotation:
          description: Number of annotation changes.
          type: integer
          default: 0
        unclassified:
          description: Number of unclassified changes.
          type: integer
          default: 0
    Permission:
      description: Permission
      type: string
      enum:
      - read
      - create_and_update_package
      - delete_package
      - manage_draft_version
      - manage_release_version
      - manage_archived_version
      - user_access_management
      - access_token_management
      example: read
    Role:
      description: Represents a role with its identifier, display name, and assigned permissions.
      type: object
      title: Role
      required:
      - roleId
      - role
      - permissions
      properties:
        roleId:
          type: string
          description: Unique role identifier. The value is the slug of role name.
          example: editor
        role:
          type: string
          description: Role name.
          example: Editor
    PackageCreate:
      description: Parameters for the package creation
      required:
      - alias
      - name
      - kind
      type: object
      properties:
        parentId:
          description: Parent package ID
          type: string
        kind:
          description: 'Package kind.

            * If kind = workspace, the parentId will be ignored.

            * If kind = group or package or dashboard, the parentId is required.

            '
          type: string
          enum:
          - workspace
          - group
          - package
          - dashboard
        name:
          description: Name of the new package
          type: string
        alias:
          description: Package short alias (abbreviation)
          type: string
          maxLength: 10
          pattern: ^[a-zA-Z0-9-_]
        description:
          description: Common description of the package
          type: string
        serviceName:
          description: 'Service name that package belongs to. Should be equal to service deployment name in kubernetes.

            Ignored for Workspace and Group kind.

            '
          type: string
        defaultRole:
          description: Default role of the package.
          type: string
        releaseVersionPattern:
          description: Release version mask. Value shall be inherited from parent group with the ability to override it.
          type: string
        excludeFromSearch:
          description: 'If true, the package (including child packages) will be ignored by global search.

            Changing the value of the parent package will change the value of all child packages.

            A child package cannot have a negative value if the parent package has a positive value. The default value for a newly created package is equal to the value from the parent package.

            '
          type: boolean
    PackageExportConfig:
      description: Configuration for documents export settings.
      type: object
      properties:
        allowedOasExtensions:
          description: List of OAS extensions that shall be preserverd when user exports OpenAPI specification(s) with remove OAS extensions option.
          type: array
          items:
            type: object
            properties:
              oasExtension:
                description: 'OAS extension that shall be preserverd when user exports OpenAPI specification(s) with remove OAS extensions option.

                  '
                type: string
                pattern: ^x-
                example: x-internal-info
              packageId:
                description: 'Id of the package in which the extension was specified. This can be the id of the current package or the parent package if the extension is inherited.

                  '
                type: string
                example: WS.GRP.PCKG
              packageName:
                description: Name of the package in which the extension was specified.
                type: string
                example: Resource Inventory
              packageKind:
                description: Kind of the package in which the extension was specified.
                type: string
                enum:
                - workspace
                - group
                - package
    Job:
      description: Automatic job
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Job identifier
        name:
          type: string
          description: Job name
  examples:
    Package:
      description: Example of the package params
      value:
        packageId: QS.QSS.PRG.APIHUB
        parentId: QS.QSS.PRG
        kind: package
        name: Test package
        alias: APIHUB
        description: Package for the test purpose
        isFavorite: false
        serviceName: apihub-be
        defaultRole: Viewer
    InternalServerError:
      description: 'Example: default internal server error response'
      value:
        status: 500
        code: APIHUB-8000
        reason: InternalServerError
        message: InternalServerError
    GroupOrWorkspaceReferencedByDashboard:
      description: Group or workspace cannot be deleted because dashboard versions reference packages inside it.
      value:
        status: 409
        code: '8500'
        message: 'Cannot delete $kind $packageId: it contains packages that are referenced by dashboards: $packages. Remove the references or delete the dashboards, then retry.'
        params:
          kind: group
          packageId: sample.group
          packages: sample.group.package1 (sample.dashboard|2024.2@3, other.dashboard|2024.1@1), sample.group.package2 (other.dashboard|1.0@1)
    PackageNotFound:
      description: Package not found by ID. Response for the 404 error
      value:
        status: 404
        code: APIHUB-3020
        message: package with packageId = $packageId not found
    IncorrectInputParameters:
      description: Incorrect input parameters
      value:
        status: 400
        code: APIHUB-COMMON-4001
        message: Incorrect input parameters
    PackageReferencedByDashboard:
      description: Package cannot be deleted because one or more dashboard versions reference it.
      value:
        status: 409
        code: '8500'
        message: 'Cannot delete package $packageId: it is referenced by these dashboard versions: $dashboards. Remove the references or delete the dashboards, then retry.'
        params:
          packageId: sample.package
          dashboards: sample.dashboard|2024.2@3, other.dashboard|2024.1@1
  parameters:
    packageId:
      name: packageId
      in: path
      description: Package unique identifier (full alias)
      required: true
      schema:
        type: string
        example: QS.CloudQSS.CPQ.Q-TMF
    showParents:
      name: showParents
      in: query
      description: Show/hide the list of parent packages.
      schema:
        type: boolean
        default: false
    page:
      name: page
      in: query
      description: Page number
      schema:
        type: number
        default: 0
    limit:
      name: limit
      in: query
      description: Requested number of resources to be provided in response.
      schema:
        type: number
        default: 100
        maximum: 100
        minimum: 1
  securitySchemes:
    BearerAuth:
      type: http
      description: 'Bearer token authentication (JWT). Default security scheme for API usage. Provide Authorization: Bearer <token>.'
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: apihub-access-token
      description: Authentication via the `apihub-access-token` cookie.
    api-key:
      type: apiKey
      description: API key authentication. Send the key in the api-key header.
      name: api-key
      in: header
    BasicAuth:
      type: http
      description: Login/password authentication.
      scheme: basic
    PersonalAccessToken:
      type: apiKey
      description: Personal access token authentication. Send the token in the X-Personal-Access-Token header; use for user-issued/script access.
      name: X-Personal-Access-Token
      in: header
    RefreshTokenAuth:
      type: apiKey
      in: cookie
      name: apihub-refresh-token
      description: Authentication via refresh token cookie
externalDocs:
  description: Find out more about this project and repository documentation
  url: https://github.com/Netcracker/qubership-apihub
