  /api/v4/packages/{packageId}/activity:
    get:
      tags:
      - Packages
      summary: Get activity history for the package
      description: 'Get activity history for specific package. Return the last N events in descending date order.

        '
      operationId: getPackageIdActivityV4
      parameters:
      - name: packageId
        description: Package unique string identifier (full alias).
        in: path
        required: true
        schema:
          type: string
      - name: types
        description: 'Filter for events by group types:

          * package_members - grant_role, update_role, delete_role.

          * package_security - generate_api_key, revoke_api_key.

          * new_version - publish_new_version.

          * package_version - patch_version_meta, delete_version, publish_new_revision, delete_revision.

          * package_management - create_package, delete_package, patch_package_meta.

          * operations_group - create_manual_group, delete_manual_group,

          update_operations_group_parameters

          '
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - package_members
            - package_security
            - new_version
            - package_version
            - package_management
            - operations_group
      - name: includeRefs
        in: query
        description: If true, then events for specified package and all its referenced packages (on any level of hierarchy) shall be returned
        schema:
          type: boolean
          default: false
      - name: textFilter
        in: query
        description: Filter by userName/packageName
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required:
                      - date
                      - principal
                      - packageId
                      - packageName
                      - kind
                      - params
                      properties:
                        date:
                          description: Date when event was generated
                          type: string
                          format: date-time
                        principal:
                          $ref: '#/components/schemas/ActivityHistoryPrincipal'
                        packageId:
                          description: Package unique string identifier (full alias)
                          type: string
                        packageName:
                          description: Package name
                          type: string
                        kind:
                          description: Package kind
                          type: string
                          enum:
                          - workspace
                          - group
                          - package
                          - dashboard
                        eventType:
                          description: Activity event type
                          type: string
                          enum:
                          - generate_api_key
                          - revoke_api_key
                          - create_package
                          - delete_package
                          - grant_role
                          - delete_role
                          - update_role
                          - publish_new_version
                          - delete_version
                          - delete_revision
                          - publish_new_revision
                          - patch_version_meta
                          - patch_package_meta
                          - create_manual_group
                          - delete_manual_group
                          - update_operations_group_parameters
                          - update_document_shareability
                        params:
                          type: object
                          description: Events specific params
                          oneOf:
                          - type: object
                            title: ParamsForGrantAndDeleteRole
                            description: params for grant_role and delete_role events
                            required:
                            - memberId
                            - memberName
                            - roles
                            properties:
                              memberId:
                                description: Login of the member
                                type: string
                                example: user1221
                              memberName:
                                description: User which was added/deleted to/from package with some role(s)
                                type: string
                                example: John Doe
                              roles:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Role'
                          - type: object
                            title: ParamsForUpdateRole
                            description: params for update_role event
                            required:
                            - memberId
                            - memberName
                            properties:
                              memberId:
                                description: Login of the member
                                type: string
                                example: user1221
                              memberName:
                                description: User which was added/deleted to/from package with some role(s)
                                type: string
                                example: John Doe
                          - type: object
                            title: ParamsForPublishAndDeleteVersion
                            description: params for publish_new_version and delete_version events
                            required:
                            - version
                            - status
                            properties:
                              version:
                                description: Package version name. The <version>@<revision> mask is used to return the revision number.
                                type: string
                                example: 22.3@1
                              notLatestRevision:
                                type: boolean
                                default: false
                              status:
                                $ref: '#/components/schemas/VersionStatusEnum'
                          - type: object
                            title: ParamsForPublishNewRevision
                            description: params for publish_new_revision event
                            required:
                            - version
                            - status
                            properties:
                              version:
                                description: Package version name. The <version>@<revision> mask is used to return the revision number.
                                type: string
                                example: 22.3@2
                              notLatestRevision:
                                type: boolean
                                default: false
                              status:
                                $ref: '#/components/schemas/VersionStatusEnum'
                          - type: object
                            title: ParamsForUpdateVersionMeta
                            description: params for patch_version_meta event
                            required:
                            - version
                            - versionMeta
                            properties:
                              version:
                                description: Package version name. The <version>@<revision> mask is used to return the revision number.
                                type: string
                                example: 22.3@2
                              notLatestRevision:
                                type: boolean
                                default: false
                              versionMeta:
                                description: List of parameters that was updated in version
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - status
                                  - label
                          - type: object
                            title: ParamsForPatchPackageMeta
                            description: params for patch_package_meta event
                            required:
                            - packageMeta
                            properties:
                              packageMeta:
                                description: List of parameters that was updated in package
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - name
                                  - description
                                  - serviceName
                                  - defaultRole
                          - type: object
                            title: ParamsForPostDeleteManualGroups
                            description: 'params for the following events:

                              * create_manual_group

                              * deleted_manual_group

                              '
                            required:
                            - version
                            - groupName
                            - apiType
                            properties:
                              version:
                                description: Package version name. The <version>@<revision> mask is used to return the revision number.
                                type: string
                                example: 22.3@2
                              notLatestRevision:
                                type: boolean
                                default: false
                                description: If parameter is not returned, then it is latest revision.
                              groupName:
                                description: Manual group name
                                type: string
                              apiType:
                                type: string
                                enum:
                                - rest
                                - graphql
                                - protobuf
                                - asyncapi
                          - type: object
                            title: ParamsForPatchOperationsGroup
                            description: 'params for the update_operations_group_parameters event

                              '
                            required:
                            - version
                            - groupName
                            - groupsParams
                            - isPrefixGroup
                            - apiType
                            properties:
                              version:
                                description: Package version name. The <version>@<revision> mask is used to return the revision number.
                                type: string
                                example: 22.3@2
                              notLatestRevision:
                                description: If parameter is not returned, then it is latest revision.
                                type: boolean
                                default: false
                              groupName:
                                description: Manual group name
                                type: string
                              groupsParams:
                                description: List of parameters that was updated in group
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - name
                                  - description
                                  - template
                                  - operations
                              isPrefixGroup:
                                type: boolean
                                description: true - if the group created automatically via restGroupingPrefix.
                              apiType:
                                type: string
                                enum:
                                - rest
                                - graphql
                                - protobuf
                                - asyncapi
                          - type: object
                            title: ParamsForDeleteRevision
                            description: 'params for delete_revision event

                              '
                            required:
                            - version
                            - status
                            properties:
                              version:
                                description: Package version name with revision. The <version>@<revision> format is used.
                                type: string
                                example: 4@2
                              status:
                                $ref: '#/components/schemas/VersionStatusEnum'
                          - type: object
                            title: ParamsForUpdateDocumentShareability
                            description: params for update_document_shareability event
                            required:
                            - version
                            - documentDisplayName
                            - shareabilityStatus
                            properties:
                              version:
                                description: Package version name. The <version>@<revision> mask is used to return the revision number.
                                type: string
                                example: 22.3@2
                              notLatestRevision:
                                type: boolean
                                default: false
                                description: If parameter is not returned, then it is latest revision.
                              documentDisplayName:
                                description: Title + version of the document whose shareability was updated
                                type: string
                                example: API Specification 1.0.0
                              shareabilityStatus:
                                description: New shareability status
                                type: string
                                enum:
                                - shareable
                                - non-shareable
                                - unknown
        '301':
          description: Moved Permanently
          headers:
            Location:
              schema:
                type: string
              description: Current ednpoint with new packageId of moved package
