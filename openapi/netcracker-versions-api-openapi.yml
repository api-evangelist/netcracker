      - name: includeDeprecatedItems
        in: query
        description: Include deprecated items inside operation.
        schema:
          type: boolean
          default: false
      - name: ids
        in: query
        description: List of the operationId to filter.
        schema:
          type: array
          items:
            type: string
          example:
          - get-quoteManagement-v5-quote
          - post-quoteManagement-v5-quote
      - name: version
        in: path
        description: 'Package version.

          The mask <version>@<revision> may be used for search in a specific revision.

          '
        required: true
        schema:
          type: string
          example: 2022.3@3
      - name: refPackageId
        description: Filter by package id of ref package, shall be used in case of dashboard.
        in: query
        schema:
          type: string
      - name: textFilter
        in: query
        description: 'Filter operation by operation title/path/method.

          For AsyncAPI: searches by message title(or messageId), channel title(or channelId) or operation action.

          '
        schema:
          type: string
      - name: apiKind
        description: Filter by API kind
        in: query
        schema:
          type: string
          enum:
          - bwc
          - no-bwc
          - experimental
      - name: documentSlug
        in: query
        description: Document unique string identifier
        schema:
          type: string
          pattern: ^[a-z0-9-]
          example: qitmf-v5-11-json
      - name: tag
        in: query
        description: 'A full match is required.\

          Multiple tags separated by comma can be specified.

          '
        schema:
          type: string
          example: tag1, tag2
      - name: emptyTag
        in: query
        description: 'Flag, filtering the operations without tags at all.

          In response will be returned the list of operations, on what the tag is not filled in.

          This attribute has a higher priority than the **tag**. In case, then **emptyTag: true**, it will override the **tag** filter.

          '
        schema:
          type: boolean
          default: false
      - name: group
        in: query
        description: 'Name of the group for filtering.\

          Either "group" or "emptyGroup" (= true) can be sent in the request, if both of them are specified then 400 will be returned in the response.

          '
        schema:
          type: string
          example: v1
      - name: emptyGroup
        in: query
        description: 'Flag for filtering operations without a group.\

          Either "group" or "emptyGroup" (= true) can be sent in the request, if both of them are specified then 400 will be returned in the response.

          '
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    description: 'List of discrepancies data of operations in a published version.

                      The resulted list depends on the API type.

                      '
                    type: array
                    items:
                      allOf:
                      - type: object
                        properties:
                          packageRef:
                            description: 'Parent package and version link. Created by the concatenation of the packageId and version name with At sign.

                              '
                            type: string
                            example: QS.CloudQSS.CPQ.Q-TMF@2023.2
                          operationId:
                            description: Operation generated unique identifier (slug).
                            type: string
                            example: get-quoteManagement-v5-quote
                          title:
                            description: Operation summary/title.
                            type: string
                          apiKind:
                            description: Operation API kind
                            type: string
                            enum:
                            - bwc
                            - no-bwc
                            - experimental
                          deprecated:
                            description: True if the operation itself is deprecated.
                            type: boolean
                          deprecatedInPreviousVersions:
                            description: List of previous release versions where operation was also deprecated
                            type: array
                            items:
                              type: string
                            example:
                            - '2022.2'
                            - 2022,1
                            - '2021.4'
                          deprecatedCount:
                            type: string
                            description: number of deprecated items in the operation
                          deprecatedInfo:
                            description: "Additional information about deprecated operation:\n* for REST API it is value of 'x-deprecated-meta' extension (value of extension must be string), which is defined for deprecated operation.\n* for GraphQL API it is value of 'reason' argument of @deprecated directive, which is defined for deprecated operation.\n* for AsyncAPI 3.0: \"[Deprecated] message {name}\" when message has x-deprecated: true (name = message.title or messageId),\n  or \"[Deprecated] channel {name}\" when channel has x-deprecated: true (name = channel.title or channelId).\n"
                            type: string
                          deprecatedItems:
                            allOf:
                            - $ref: '#/components/schemas/DeprecatedItems'
                            - type: object
                              description: List of deprecated items in the operation. deprecatedItems is required only if includeDeprecatedItems = true
                          externalMetadata:
                            description: External operation metadata.
                            type: object
                      - oneOf:
                        - $ref: '#/components/schemas/RestOperationMeta'
                        - $ref: '#/components/schemas/GraphQLOperationMeta'
                        - $ref: '#/components/schemas/ProtobufOperationMeta'
                        - $ref: '#/components/schemas/AsyncAPIOperationMeta'
                  packages:
                    $ref: '#/components/schemas/PackagesMap'
        '301':
          description: Moved Permanently
          headers:
            Location:
              schema:
                type: string
              description: Current ednpoint with new packageId of moved package
            X-New-Package-Id:
              schema:
                type: string
              description: New packageId of moved package
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PackageNotFound:
                  $ref: '#/components/examples/PackageNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerError'
