components:
  schemas:
    VersionStatusEnum:
      description: Package version status
      type: string
      enum:
      - draft
      - release
      - archived
    GqlOperationInfoFromDifferentVersions:
      description: Operation info from previous/current version.
      allOf:
      - $ref: '#/components/schemas/OperationInfoFromDifferentVersionsV2'
      - type: object
        required:
        - type
        - method
        properties:
          type:
            description: Operation type
            type: string
            enum:
            - query
            - mutation
            - subscription
          method:
            description: GraphQL operation method.
            type: string
            example: getPaymentMethodSpecificationCore
    DdlEntityChange:
      description: One side (current or previous) of a DDL entity in a changelog change entry.
      type: object
      allOf:
      - $ref: '#/components/schemas/DdlEntity'
      - type: object
        properties:
          packageRef:
            description: Package and version reference key.
            type: string
            example: QS.CloudQSS.CPQ.Q-TMF@2023.2
    ChangeReplace:
      type: object
      description: Data of single operation change when change action = replace
      properties:
        currentDeclarationJsonPaths:
          description: '(below, a document is not considered to be an original document, but a document with one specific operation)\

            When comparing two documents (origin and changed; difference from changed document apended to the original document), a declarative jsonPath is calculated for each change.

            '
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
          example:
          - - components/schemas/Cat/minProperties
            - components/schemas/Dog/minProperties
          - - /quoteManagement/v5/quote
        previousDeclarationJsonPaths:
          description: '(below, a document is not considered to be an original document, but a document with one specific operation)\

            When comparing two documents (origin and changed; difference from changed document apended to the original document), a declarative jsonPath is calculated for each change.

            '
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
          example:
          - - components/schemas/Cat/minProperties
            - components/schemas/Dog/minProperties
          - - /quoteManagement/v5/quote
        previousValueHash:
          type: string
          description: 'Previous hash of the changed entity.\

            Hash is needed to identify that the same enitity was changed in other operations, that allows calculating declarative number of changes in package version.

            '
        currentValueHash:
          type: string
          description: 'Current hash of the changed entity.\

            Hash is needed to identify that the same enitity was changed in other operations, that allows calculating declarative number of changes in package version.

            '
    RestOperationInfoFromDifferentVersions:
      description: Operation info from previous/current version.
      allOf:
      - $ref: '#/components/schemas/OperationInfoFromDifferentVersionsV2'
      - type: object
        required:
        - path
        - method
        properties:
          path:
            description: Operation endpoint path.
            type: string
            example: /quoteManagement/v5/quote
          method:
            description: Operation method.
            type: string
            enum:
            - post
            - get
            - put
            - patch
            - delete
            - head
            - options
            - connect
            - trace
    VersionComparisonContractsSummary:
      description: 'Contract comparison summary, keyed by contract type. MCP is omitted in v1 because MCP discovery

        entities are not diffed.

        '
      type: object
      properties:
        ddl:
          type: object
          properties:
            changesSummary:
              allOf:
              - $ref: '#/components/schemas/ChangeSummary'
              - type: object
                description: Number of declarative DDL changes of each severity type.
            numberOfImpactedEntities:
              allOf:
              - $ref: '#/components/schemas/ChangeSummary'
              - type: object
                description: Number of DDL entities impacted by each severity type.
    ApiType:
      title: apiType
      type: string
      enum:
      - rest
      - graphql
      - protobuf
      - asyncapi
    PackagesMap:
      description: 'A map of referenced package versions to the package version objects.

        The key is `packageId@version@revision` — three `@`-separated segments (note: the `version` field

        of each value is `version@revision`, only two segments).

        '
      type: object
      additionalProperties:
        $ref: '#/components/schemas/PackageVersionRef'
      example:
        QS.CloudQSS.CPQ.Q-TMF@2023.2@3:
          refId: QS.CloudQSS.CPQ.Q-TMF
          kind: package
          name: Quote Management TMF648
          version: 2023.2@3
          status: release
          parentPackages:
          - qubership
          - Qubership JSS
          - Sample Management
          deletedAt: '2023-05-30T17:17:11.755146Z'
          deletedBy: user1221
          notLatestRevision: true
    ErrorResponse:
      description: Standard error response returned for failed requests. Includes HTTP status, internal error code, human-readable message, optional message parameters, and optional debug details (non-production only).
      type: object
      properties:
        status:
          description: HTTP status code as an integer; expected to match the actual HTTP response status.
          type: number
        code:
          description: Internal string error code. Mandatory in response.
          type: string
        message:
          description: Human-readable error message describing what went wrong; intended for diagnostics and safe client display.
          type: string
        params:
          type: object
          description: Optional key/value parameters used to format or contextualize the error message (for example, identifiers or field names).
          example:
            id: 12345
            type: string
        debug:
          description: Optional debug details (for example, stack traces). Returned only in development/test environments when verbose logging is enabled; do not rely on this field in production because it may contain sensitive data.
          type: string
      required:
      - status
      - code
      - message
    SingleOperationChange:
      allOf:
      - type: object
        description: Discrepancy data in a single operation.
        properties:
          description:
            description: Human-readable description of point of change.
            type: string
            example: '[Added] Property: summary.'
          severity:
            $ref: '#/components/schemas/ChangeSeverity'
          scope:
            type: string
            description: 'Part of operation (like request/response) where change was made. Scope differs for apiTypes.\

              Scope is needed to correctly identify severity of change, because the same change can have different severity in request/response.

              '
          action:
            description: Action, what was done with the endpoint.
            type: string
            enum:
            - add
            - remove
            - replace
            - rename
      - oneOf:
        - $ref: '#/components/schemas/ChangeAdd'
        - $ref: '#/components/schemas/ChangeRemove'
        - $ref: '#/components/schemas/ChangeReplace'
        - $ref: '#/components/schemas/ChangeRename'
    AsyncAPIOperationInfoFromDifferentVersions:
      description: AsyncAPI 3.0 operation info from previous/current version.
      allOf:
      - $ref: '#/components/schemas/OperationInfoFromDifferentVersionsV2'
      - type: object
        required:
        - action
        - channel
        - protocol
        - asyncOperationId
        - messageId
        properties:
          action:
            description: 'AsyncAPI operation action: send or receive.'
            type: string
            enum:
            - send
            - receive
          channel:
            description: 'AsyncAPI channel identifier.

              Uses channel.title if available; otherwise uses channelId (key in the document''s root channels map).

              '
            type: string
            example: User Signup Channel
          protocol:
            description: 'Communication protocol derived from the channel''s first server.

              Expected values: kafka, amqp. Any other protocol value from the spec is displayed as-is.

              If the channel has no server references or the protocol cannot be resolved, the value is "Unknown".

              '
            type: string
            example: kafka
          asyncOperationId:
            description: 'AsyncAPI operationId as defined in the AsyncAPI specification.

              The key in the root operations map that identifies the operation.

              '
            type: string
            example: onUserSignUp
          messageId:
            description: 'AsyncAPI messageId as defined in the AsyncAPI specification.

              The key in the channel''s messages map that identifies the message.

              '
            type: string
            example: userSignedUp
    PackageVersionRef:
      description: Package version reference
      type: object
      title: Referenced package version
      required:
      - refId
      - kind
      - name
      - version
      - status
      properties:
        refId:
          description: Referenced package Id.
          type: string
          example: QS.CloudQSS.CPQ.CORE
        kind:
          description: Package kind
          type: string
          enum:
          - package
          - dashboard
        name:
          description: Name of the referenced package
          type: string
          example: Quote Management TMF648
        version:
          description: Referenced package version number. The <version>@<revision> mask is used to return the revision number.
          type: string
          example: 2022.2@5
        status:
          $ref: '#/components/schemas/VersionStatusEnum'
        parentPackages:
          description: Array of parent package names
          type: array
          items:
            type: string
        deletedAt:
          description: date when package version was deleted package version
          type: string
          format: date-type
          example: '2023-05-30T17:17:11.755146Z'
        deletedBy:
          description: user who deleted package version
          type: string
          example: user1221
        notLatestRevision:
          type: boolean
          default: false
    DdlEntity:
      type: object
      description: 'Identified DDL entity — its stable id and descriptor (kind/name/schemaName/description). The core

        shared by the build result and the API; each context adds its own fields via allOf.

        '
      required:
      - ddlEntityId
      - kind
      - name
      - schemaName
      - description
      properties:
        ddlEntityId:
          description: Stable DDL entity identifier, `{schemaName}-{kind}-{name}` slugified.
          type: string
          example: public-table-users
        kind:
          description: DDL contract entity kind. Only `table` is produced in the current version.
          type: string
          enum:
          - table
          example: table
        name:
          description: Table name.
          type: string
          example: users
        schemaName:
          description: Schema name the entity belongs to (the entity scope).
          type: string
          example: public
        description:
          description: Value of `COMMENT ON TABLE`, or an empty string when none is present.
          type: string
          example: Registered users
    ChangeRename:
      type: object
      description: Data of single operation change when change action = rename.
      properties:
        currentDeclarationJsonPaths:
          description: '(below, a document is not considered to be an original document, but a document with one specific operation)\

            When comparing two documents (origin and changed; difference from changed document apended to the original document), a declarative jsonPath is calculated for each change.

            '
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
          example:
          - - components/schemas/Cat/minProperties
            - components/schemas/Dog/minProperties
          - - /quoteManagement/v5/quote
        previousDeclarationJsonPaths:
          description: '(below, a document is not considered to be an original document, but a document with one specific operation)\

            When comparing two documents (origin and changed; difference from changed document apended to the original document), a declarative jsonPath is calculated for each change.

            '
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
          example:
          - - components/schemas/Cat/minProperties
            - components/schemas/Dog/minProperties
          - - /quoteManagement/v5/quote
        previousKey:
          type: string
          description: Previous key (name) of the renamed entity.
        currentKey:
          type: string
          description: Current key (name) of the renamed entity.
    ChangeSummary:
      description: 'Numbers of changes between the current and previous published version.

        '
      type: object
      properties:
        breaking:
          description: Number of changes, breaking the backward compatibility.
          type: integer
          default: 0
        semi-breaking:
          description: Number of changes, breaking the backward compatibility in a legal way. For example, deleting correctly deprecated endpoint.
          type: integer
          default: 0
        deprecated:
          description: Number of deprecated endpoints.
          type: integer
          default: 0
        non-breaking:
          description: Number of non-breaking changes.
          type: integer
          default: 0
        annotation:
          description: Number of annotation changes.
          type: integer
          default: 0
        unclassified:
          description: Number of unclassified changes.
          type: integer
          default: 0
    ChangeAdd:
      type: object
      description: Data of single operation change when change action = add
      properties:
        currentDeclarationJsonPaths:
          description: '(below, a document is not considered to be an original document, but a document with one specific operation)\

            When comparing two documents (origin and changed; difference from changed document apended to the original document), a declarative jsonPath is calculated for each change.

            '
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
          example:
          - - components/schemas/Cat/minProperties
            - components/schemas/Dog/minProperties
          - - /quoteManagement/v5/quote
        currentValueHash:
          type: string
          description: 'Hash of the added entity.\

            Hash is needed to identify that the same enitity was changed in other operations, that allows calculating declarative number of changes in package version.

            '
    ChangeSeverity:
      description: Severity of the particular change.
      type: string
      enum:
      - breaking
      - semi-breaking
      - deprecated
      - non-breaking
      - annotation
      - unclassified
    InternalDocumentMetadata:
      type: object
      required:
      - id
      - fileName
      properties:
        id:
          description: Published file id.
          type: string
          pattern: ^[a-z0-9-]
          example: qitmf-v5-11-json
        fileName:
          type: string
          description: File name (slug+extension).
          example: qitmf-v5.11.json
    ChangeRemove:
      type: object
      description: Data of single operation change when change action = remove.
      properties:
        previousDeclarationJsonPaths:
          description: '(below, a document is not considered to be an original document, but a document with one specific operation)\

            When comparing two documents (origin and changed; difference from changed document apended to the original document), a declarative jsonPath is calculated for each change.

            '
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
          example:
          - - components/schemas/Cat/minProperties
            - components/schemas/Dog/minProperties
          - - /quoteManagement/v5/quote
        previousValueHash:
          type: string
          description: 'Hash of the removed entity.\

            Hash is needed to identify that the same enitity was changed in other operations, that allows calculating declarative number of changes in package version.

            '
    OperationInfoFromDifferentVersionsV2:
      description: Operation info from previous/current version.
      type: object
      required:
      - operationId
      - title
      - apiKind
      - documentId
      - apiAudience
      properties:
        operationId:
          description: Operation unique identifier (for rest api this operationId is not the same as operationId field from the OpenAPI file).
          type: string
          example: get-quoteManagement-v5-quote
        documentId:
          description: Unique string identifier of the document from which the operation is originated
          type: string
          pattern: ^[a-z0-9-]
          example: qitmf-v5-11-json
        title:
          description: Operation summary/title.
          type: string
        apiKind:
          type: string
          enum:
          - bwc
          - no-bwc
          - experimental
        apiAudience:
          description: 'Operation''s target audience:

            * internal - APIs are available for integration within product application.

            * external - APIs exposed outside the boundary of product application: solution delivery integrations, 3rd party integrations, customer integrations.

            * unknown - If any value other than internal or external is used, the API is considered as unknown.

            '
          type: string
          enum:
          - internal
          - external
          - unknown
        tags:
          description: Tags of operation. For rest - tag is taken from OAS, for graphql - tag is root schema type (query, mutation, subscription).
          type: array
          items:
            type: string
          example:
          - Access Control API, Address Management API
        packageRef:
          description: 'Parent package and version link. Created by the concatenation of the packageId and version name with At sign.

            '
          type: string
          example: QS.CloudQSS.CPQ.Q-TMF@2023.2
  parameters:
    packageId:
      name: packageId
      in: path
      description: Package unique identifier (full alias)
      required: true
      schema:
        type: string
        example: QS.CloudQSS.CPQ.Q-TMF
    apiType:
      name: apiType
      description: Type of the API.
      in: path
      required: true
      schema:
        type: string
        enum:
        - rest
        - graphql
        - protobuf
        - asyncapi
    ddlEntityId:
      name: ddlEntityId
      in: path
      required: true
      description: DDL entity logical identifier. Clients must percent-encode unsafe characters.
      schema:
        type: string
        example: public-table-users
    severity:
      name: severity
      in: query
      description: Filter API changes by severity.
      schema:
        type: array
        items:
          type: string
          enum:
          - breaking
          - non-breaking
          - deprecated
          - semi-breaking
          - annotation
          - unclassified
    previousVersion:
      name: previousVersion
      in: query
      description: 'Package previous version.

        If both previousVersion and previousVersionPackageId are not specified, then the previous **release** version will be used.

        '
      schema:
        type: string
        example: '2022.3'
    version:
      name: version
      in: path
      description: Package version
      required: true
      schema:
        type: string
        example: '2022.3'
    asyncapiProtocol:
      name: asyncapiProtocol
      in: query
      description: 'Filter operations by communication protocol.

        Applicable only when apiType = asyncapi; ignored for other API types.

        The value is the protocol string from the channel''s server (e.g. kafka, amqp).

        Use "Unknown" for operations where the protocol could not be resolved.

        '
      schema:
        type: string
        example: kafka
    previousVersionPackageId:
      name: previousVersionPackageId
      in: query
      description: 'Package unique identifier for previous version.

        If both previousVersion and previousVersionPackageId are not specified, then the previous **release** version will be used.

        '
      schema:
        type: string
        example: QS.RUNENV.K8S-SERVER.CJM-QSS-DEV-2.Q-TMF
    apiAudience:
      name: apiAudience
      in: query
      description: 'Filter operations by apiAudience.

        * internal - APIs are available for integration within product application.

        * external - APIs exposed outside the boundary of the product application: solution delivery integrations, 3rd party integrations, customer integrations.

        * unknown - If any value other than internal or external is used, the API is considered as unknown.

        '
      schema:
        type: string
        enum:
        - all
        - internal
        - external
        - unknown
        default: all
    operationId:
      name: operationId
      in: path
      description: Operation unique identifier (slug). Not the same as operationId tag from the OpenAPI file.
      required: true
      schema:
        type: string
        example: get-quoteManagement-v5-quote-quoteId
    page:
      name: page
      in: query
      description: Page number
      schema:
        type: number
        default: 0
    limit:
      name: limit
      in: query
      description: Requested number of resources to be provided in response.
      schema:
        type: number
        default: 100
        maximum: 100
        minimum: 1
    asyncapiChannel:
      name: asyncapiChannel
      in: query
      description: 'Filter operations by AsyncAPI channel identifier (comma-separated).

        Applicable only when apiType = asyncapi; ignored for other API types.

        '
      schema:
        type: string
        example: userSignup,orderCreated
  examples:
    InternalServerError:
      description: 'Example: default internal server error response'
      value:
        status: 500
        code: APIHUB-8000
        reason: InternalServerError
        message: InternalServerError
    PackageNotFound:
      description: Package not found by ID. Response for the 404 error
      value:
        status: 404
        code: APIHUB-3020
        message: package with packageId = $packageId not found
    VersionNotFound:
      description: Version not found by number. Response for the 404 error
      value:
        status: 404
        code: APIHUB-3050
        message: Published version $version not found
    IncorrectInputParameters:
      description: Incorrect input parameters
      value:
        status: 400
        code: APIHUB-COMMON-4001
        message: Incorrect input parameters
  securitySchemes:
    BearerAuth:
      type: http
      description: 'Bearer token authentication (JWT). Default security scheme for API usage. Provide Authorization: Bearer <token>.'
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: apihub-access-token
      description: Authentication via the `apihub-access-token` cookie.
    api-key:
      type: apiKey
      description: API key authentication. Send the key in the api-key header.
      name: api-key
      in: header
    BasicAuth:
      type: http
      description: Login/password authentication.
      scheme: basic
    PersonalAccessToken:
      type: apiKey
      description: Personal access token authentication. Send the token in the X-Personal-Access-Token header; use for user-issued/script access.
      name: X-Personal-Access-Token
      in: header
    RefreshTokenAuth:
      type: apiKey
      in: cookie
      name: apihub-refresh-token
      description: Authentication via refresh token cookie
externalDocs:
  description: Find out more about this project and repository documentation
  url: https://github.com/Netcracker/qubership-apihub
