components:
  schemas:
    BuildConfigRef:
      type: object
      properties:
        refId:
          type: string
        version:
          type: string
        parentRefId:
          type: string
        parentVersion:
          type: string
        excluded:
          type: boolean
    BuildConfigMetadata:
      type: object
      properties:
        branchName:
          type: string
        repositoryUrl:
          type: string
        cloudName:
          type: string
        cloudUrl:
          type: string
        namespace:
          type: string
        versionLabels:
          type: array
          items:
            type: string
    ErrorResponse:
      description: Standard error response returned for failed requests. Includes HTTP status, internal error code, human-readable message, optional message parameters, and optional debug details (non-production only).
      type: object
      properties:
        status:
          description: HTTP status code as an integer; expected to match the actual HTTP response status.
          type: number
        code:
          description: Internal string error code. Mandatory in response.
          type: string
        message:
          description: Human-readable error message describing what went wrong; intended for diagnostics and safe client display.
          type: string
        params:
          type: object
          description: Optional key/value parameters used to format or contextualize the error message (for example, identifiers or field names).
          example:
            id: 12345
            type: string
        debug:
          description: Optional debug details (for example, stack traces). Returned only in development/test environments when verbose logging is enabled; do not rely on this field in production because it may contain sensitive data.
          type: string
      required:
      - status
      - code
      - message
    ExtendedBuilds:
      type: object
      properties:
        builds:
          type: array
          items:
            $ref: '#/components/schemas/ExtendedBuild'
      required:
      - builds
    BuildConfig:
      type: object
      description: Build configuration persisted in build_src.config.
      additionalProperties: true
      properties:
        packageId:
          type: string
        version:
          type: string
        buildType:
          type: string
          enum:
          - changelog
          - build
          - reducedSourceSpecifications
          - mergedSpecification
          - exportVersion
          - exportRestDocument
          - exportRestOperationsGroup
          - exportGraphqlOperationsGroup
          - exportAsyncapiOperationsGroup
        previousVersion:
          type: string
        previousVersionPackageId:
          type: string
        status:
          type: string
        refs:
          type: array
          items:
            $ref: '#/components/schemas/BuildConfigRef'
        files:
          type: array
          items:
            $ref: '#/components/schemas/BuildConfigFile'
        publishId:
          type: string
        metadata:
          $ref: '#/components/schemas/BuildConfigMetadata'
        createdBy:
          type: string
        noChangeLog:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        migrationBuild:
          type: boolean
        migrationId:
          type: string
        comparisonRevision:
          type: integer
          format: int32
        comparisonPrevRevision:
          type: integer
          format: int32
        unresolvedRefs:
          type: boolean
        resolveRefs:
          type: boolean
