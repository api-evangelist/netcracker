        code: APIHUB-8000
        reason: InternalServerError
        message: InternalServerError
    VersionReferencedAsPreviousByRelease:
      description: Version cannot be changed to 'draft' because a released version uses it as its previous version
      value:
        status: 400
        code: '8600'
        message: 'Version 2024.1 for package QS.group.my-package cannot be changed to the ''draft'' status because it is the previous version of released versions: QS.group.other-package|2024.2@1'
        params:
          version: '2024.1'
          packageId: QS.group.my-package
          releaseVersions: QS.group.other-package|2024.2@1
    PreviousVersionNotRelease:
      description: A release version cannot reference a draft previous version
      value:
        status: 400
        code: '8600'
        message: Version 2024.2 for package QS.group.my-package cannot be published with the 'release' status because previous version 2024.1 for package QS.group.previous-package is in the 'draft' status. Change the previous version to 'release', or publish this version as a draft.
        params:
          version: '2024.2'
          packageId: QS.group.my-package
          previousVersion: '2024.1'
          previousVersionPackageId: QS.group.previous-package
    VersionStatusChangePreviousVersionNotRelease:
      description: Version status cannot be changed to 'release' when the previous version is a draft
      value:
        status: 400
        code: '8600'
        message: Version 2024.2 for package QS.group.my-package cannot be changed to the 'release' status because previous version 2024.1 for package QS.group.previous-package is in the 'draft' status. Change the previous version to 'release', then retry.
        params:
          version: '2024.2'
          packageId: QS.group.my-package
          previousVersion: '2024.1'
          previousVersionPackageId: QS.group.previous-package
    GroupOrWorkspaceReferencedByDashboard:
      description: Group or workspace cannot be deleted because dashboard versions reference packages inside it.
      value:
        status: 409
        code: '8500'
        message: 'Cannot delete $kind $packageId: it contains packages that are referenced by dashboards: $packages. Remove the references or delete the dashboards, then retry.'
        params:
          kind: group
          packageId: sample.group
          packages: sample.group.package1 (sample.dashboard|2024.2@3, other.dashboard|2024.1@1), sample.group.package2 (other.dashboard|1.0@1)
    PackageNotFound:
