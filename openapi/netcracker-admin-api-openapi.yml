      value:
        status: 404
        code: APIHUB-3020
        message: package with packageId = $packageId not found
    IncorrectInputParameters:
      description: Incorrect input parameters
      value:
        status: 400
        code: APIHUB-COMMON-4001
        message: Incorrect input parameters
    VersionReferencedByDashboard:
      description: Version cannot be deleted because one or more dashboard versions reference it.
      value:
        status: 409
        code: '8500'
        message: 'Cannot delete version $version of package $packageId: it is referenced by these dashboard versions: $dashboards. Remove the references or delete the dashboards, then retry.'
        params:
          packageId: sample.package
          version: '2024.1'
          dashboards: sample.dashboard|2024.2@3, other.dashboard|2024.1@1
    PackageReferencedByDashboard:
      description: Package cannot be deleted because one or more dashboard versions reference it.
