openapi: 3.2.0
info:
  title: DBaaS Aggregator API version controller API
  version: 6.13.2
  description: This documentation presents the REST API for the "Database as a Service" (DBaaS) component.
tags:
- name: API version controller
  description: Providing API version info
paths:
  /api-version:
    get:
      tags:
      - API version controller
      responses:
        '200':
          description: Current APi version and supported API versions
          content:
            application/json:
              schema: {}
      summary: Api Version Info
      operationId: getApiVersion
      x-operation-id-source: derived
components:
  securitySchemes:
    SecurityScheme:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication
