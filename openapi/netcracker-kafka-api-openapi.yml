components:
  schemas:
    model.Classifier:
      properties:
        name:
          type: string
        namespace:
          type: string
        tenantId:
          type: string
      required:
      - name
      - namespace
      type: object
    model.TopicDeletionError:
      properties:
        message:
          example: <error message>
          type: string
        topic:
          $ref: '#/components/schemas/model.TopicRegistrationRespDto'
      type: object
    model.KafkaCredentials:
      properties:
        clientCert:
          type: string
        clientKey:
          type: string
        password:
          type: string
        type:
          type: string
        username:
          type: string
      type: object
    model.TopicSearchRequest:
      properties:
        classifier:
          $ref: '#/components/schemas/model.Classifier'
        instance:
          example: <id of kafka instance where topics are created>
          type: string
        leaveRealTopicIntact:
          type: boolean
        namespace:
          example: <namespace to which topics belong>
          type: string
        template:
          type: integer
        topic:
          example: <exact topic name in kafka>
          type: string
        versioned:
          type: boolean
      type: object
    model.TopicRegistrationRespDto:
      properties:
        actualSettings:
          $ref: '#/components/schemas/model.TopicSettings'
        addresses:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        caCert:
          example: ' '
          type: string
        classifier:
          $ref: '#/components/schemas/model.Classifier'
        credential:
          additionalProperties:
            items:
              $ref: '#/components/schemas/model.KafkaCredentials'
            type: array
          type: object
        externallyManaged:
          type: boolean
        instance:
          example: localkafka
          type: string
        name:
          example: local.sampleTopic2.430d243ba9c74f25bf05f492a52804fd
          type: string
        namespace:
          example: local
          type: string
        requestedSettings:
          $ref: '#/components/schemas/model.TopicSettings'
        template:
          example: '2'
          type: string
        versioned:
          example: false
          type: boolean
      type: object
    model.TopicDeletionResp:
      properties:
        deletedSuccessfully:
          items:
            $ref: '#/components/schemas/model.TopicRegistrationRespDto'
          type: array
        failedToDelete:
          items:
            $ref: '#/components/schemas/model.TopicDeletionError'
          type: array
      type: object
    model.KafkaTopicSyncReport:
      properties:
        classifier:
          $ref: '#/components/schemas/model.Classifier'
        errMsg:
          example: can not get topic info
          type: string
        name:
          example: maas.local.test-topic-0
          type: string
        status:
          example: added
          type: string
      type: object
    controller.Instance:
      properties:
        id:
          example: maas-rabbitmq-code-dev
          type: string
      type: object
    model.TopicTemplate:
      properties:
        configs:
          additionalProperties:
            type: string
          type: object
        minNumPartitions:
          example: 1
          type: integer
        name:
          example: topic Name
          type: string
        namespace:
          example: local
          type: string
        numPartitions:
          example: 1
          type: integer
        replicaAssignment:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
        replicationFactor:
          example: 1
          type: integer
        versioned:
          example: true
          type: boolean
      type: object
    model.DiscrepancyReportItem:
      properties:
        classifier:
          $ref: '#/components/schemas/model.Classifier'
        name:
          example: maas.test.81.my-awesome-test-topic
          type: string
        status:
          example: ok
          type: string
      type: object
    model.KafkaInstance:
      properties:
        addresses:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        caCert:
          example: 
          type: string
        credentials:
          additionalProperties:
            items:
              $ref: '#/components/schemas/model.KafkaCredentials'
            type: array
          type: object
        default:
          example: true
          type: boolean
        id:
          example: cpq-kafka-maas-test
          type: string
        maasProtocol:
          example: SASL_PLAINTEXT
          type: string
      type: object
    model.TopicSettings:
      properties:
        configs:
          additionalProperties:
            type: string
          type: object
        minNumPartitions:
          example: 1
          type: integer
        numPartitions:
          example: 1
          type: integer
        replicaAssignment:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
        replicationFactor:
          example: 1
          type: integer
        versioned:
          example: true
          type: boolean
      type: object
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
