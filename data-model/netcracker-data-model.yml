- domain: DBaaS aggregator
  api: netcracker:qubership-dbaas-aggregator-api
  entities:
  - {name: Namespace, description: Cloud project namespace that owns logical databases.}
  - {name: LogicalDatabase, description: A managed database record routed to a physical database through an adapter., id: classifier}
  - {name: PhysicalDatabase, description: A registered backing database instance served by an adapter.}
  - {name: DatabaseUser, description: Credentials issued for a logical database.}
  - {name: BalancingRule, description: Rule that selects which physical database serves a request.}
  - {name: Backup / Restore, description: Namespace-level backup and restoration jobs.}
  relationships:
  - {from: Namespace, to: LogicalDatabase, type: has_many, via: namespace}
  - {from: LogicalDatabase, to: PhysicalDatabase, type: belongs_to, via: physicalDatabaseId}
  - {from: LogicalDatabase, to: DatabaseUser, type: has_many, via: classifier}
  - {from: PhysicalDatabase, to: BalancingRule, type: has_many, via: physicalDatabaseId}
  - {from: Namespace, to: Backup, type: has_many, via: namespace}
- domain: MaaS
  api: netcracker:qubership-maas-api
  entities:
  - {name: Namespace, description: Microservice namespace requesting messaging resources.}
  - {name: KafkaTopic, description: Provisioned Kafka topic (template/definition driven).}
  - {name: RabbitMQVirtualHost, description: Provisioned RabbitMQ vhost with entities.}
  - {name: Instance, description: Registered Kafka/RabbitMQ broker instance MaaS provisions into.}
  relationships:
  - {from: Namespace, to: KafkaTopic, type: has_many, via: namespace}
  - {from: Namespace, to: RabbitMQVirtualHost, type: has_many, via: namespace}
  - {from: KafkaTopic, to: Instance, type: belongs_to, via: instance}
  - {from: RabbitMQVirtualHost, to: Instance, type: belongs_to, via: instance}
