domains:
- domain: APIHUB registry
  api: netcracker:qubership-apihub-registry-api
  entities:
  - name: Workspace
    description: Top-level container; a package of kind `workspace`. A user also has a private personal workspace (getSpace).
    id: packageId
  - name: Group
    description: Package of kind `group`; nests other groups and packages.
  - name: Package
    description: >-
      The unit of publication — a package (or dashboard) holding versioned API
      specifications. Carries packageId, parentId, kind, name, alias, description,
      serviceName, defaultRole, isFavorite.
    id: packageId
    operations: [getPackages, getPackagesId, postPackages, patchPackagesId, deletePackagesId]
  - name: Version
    description: A published version of a package; has a status (draft/release), a previousVersion chain and revisions.
    id: version
    operations: [getPackagesIdVersionsV3, getPackagesIdVersionsIdV4, patchPackagesIdVersionsIdV2, deletePackagesIdVersionsId]
  - name: Revision
    description: An immutable re-publication of the same version number.
    operations: [getPackagesIdVersionsIdRevisionsV3]
  - name: Document
    description: >-
      A source specification file inside a version, addressed by slug (documentId).
      Types are OpenAPI, GraphQL, AsyncAPI, Markdown, JSON Schema and DDL.
    id: slug
    operations: [getPackagesIdVersionsIdDocuments, getPackagesIdVersionsIdDocumentsSlugV2, getPackagesIdVersionsIdFilesSlugRaw, updateDocumentShareability]
  - name: Operation
    description: An operation extracted from a document; carries operationId, apiType, apiKind, apiAudience, title and tags.
    id: operationId
    operations: [getPackagesIdVersionsIdApiTypeOperations, getPackagesIdVersionsIdApiTypeOperationsId]
  - name: OperationGroup
    description: A named subset of operations within a version, exportable as its own document.
    id: groupName
    operations: [PostPackageIdVersionApiTypeGroupsV3, getPackagesIdVersionsIdApiTypeGroupsGroupName, patchPackageIdVersionApiTypeGroupName, postOperationGroupPublish]
  - name: Change
    description: A classified difference (breaking vs non-breaking) between two versions, at version, operation or DDL-entity level.
    operations: [getPackageIdVersionChangesSummary, getPackagesIdVersionsIdApiTypeChangesV4, getPackagesIdVersionsApiTypeOperationsIdChanges]
  - name: Reference
    description: A dashboard version's link to another package version (the refs graph that blocks deletion).
    operations: [getPackagesIdVersionsIdReferencesv3]
  - name: DdlEntity
    description: A DDL contract entity catalogued alongside API operations.
    operations: [getPackageVersionDdlEntities, getPackageVersionDdlEntity]
  - name: McpEntity
    description: An MCP discovery-contract entity (tool/resource/prompt) catalogued per MCP endpoint of a package version.
    id: mcpEntityId
    operations: [getPackageVersionMcpEntities, getPackageVersionMcpEntity]
  - name: User
    id: userId
    operations: [getUsers, getUser, getExtendedUserV2]
  - name: Role / Permission / Member
    operations: [getRoles, getPermissions, getPackagesIdAvailableRoles, postPackagesIdMembers, patchPackagesIdMembersId]
  - name: ApiKey
    description: Package-scoped API key.
    operations: [postPackagesIdApiKeysV4, getPackagesIdApiKeysV4, deletePackagesIdApiKeysId]
  - name: PersonalAccessToken
    description: User-issued token for scripts and CLI tools.
    operations: [postPersonalAccessToken, getPersonalAccessToken, deletePersonalAccessToken]
  - name: Chat / ChatMessage
    description: Honey AI assistant conversation; messages carry a clientMessageId idempotency key and toolInvocations.
    operations: [listAiChats, createAiChat, listAiChatMessages, sendAiChatMessage, sendAiChatMessageStream]
  - name: EphemeralFile
    description: Short-lived download addressed by fileId with a signed, expiring token.
    operations: [downloadEphemeralFile]
  - name: PublishJob / ExportJob
    description: Async job handles (publishId, exportId) polled for status.
    operations: [postPackagesIdPublish, getPackagesIdPublishIdStatus, postExport, getExportIdStatus]
