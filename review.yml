aid: netcracker
name: Netcracker
review:
  question: >-
    Does Netcracker publish a real, public, self-serve developer portal and
    downloadable API definitions — and what is its actual CAMARA posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: network-vendor-bss
  gated: true
findings:
  summary: |
    Netcracker Technology (Waltham, MA; a wholly owned NEC subsidiary) is a
    BSS/OSS software vendor to communications service providers, not a carrier
    and not a CPaaS. It sits behind the operator in the telecom value chain.

    There is NO first-party developer portal on netcracker.com. Every
    conventional probe failed: developer.netcracker.com, developers.netcracker.com,
    docs.netcracker.com, api.netcracker.com, opengateway.netcracker.com and
    portal.netcracker.com all fail to resolve (curl exit / HTTP 000), and
    /developer, /developers and /api on www.netcracker.com all return 404.
    /openapi.json, /swagger.json, /api-docs, /graphql,
    /.well-known/openid-configuration and /.well-known/oauth-authorization-server
    all return 404. The word "camara" appears zero times in the site sitemap.
    The only API-related page on the corporate site is a product marketing page
    for "Netcracker API Management and Integration" — a page that sells an API
    platform to carriers while publishing no API of its own.

    The commercial telecom API surface — the TM Forum Open APIs Netcracker's
    BSS/OSS products implement — is entirely partner- and contract-gated. There
    is no public reference, no sandbox, no signup, no downloadable product spec.

    There IS, however, a real and genuinely open second surface: Qubership,
    Netcracker's open-source cloud platform. github.com/Netcracker is a verified
    GitHub organization ("Netcracker engineers' open source projects", 287 public
    repositories, contact opensourcegroup@netcracker.com) and netcracker.github.io
    is a live open-source landing site ("Netcracker Open Source — Qubership",
    HTTP 200, no login wall) with product pages at /apihub/ and /qip/. Four real
    OpenAPI/Swagger definitions were harvested verbatim from it, all of which
    parse. They describe platform-engineering components (an API registry,
    messaging, DBaaS) — not telecom network or BSS APIs.
  developerPortal:
    corporate:
      url: https://www.netcracker.com/portfolio/products/netcracker-api-management-integration
      status: 200
      verdict: marketing page
      note: >-
        Product page for the API Management and Integration product. Describes an
        "API Exposure Platform ... a single frontend for CSPs, partners and
        developers where stakeholders can discover, subscribe to and interact with
        APIs" — but that platform is software Netcracker sells to carriers, not a
        portal Netcracker operates for the public. No spec, no signup, no sandbox.
    openSource:
      url: https://netcracker.github.io/
      status: 200
      verdict: real, open, self-serve (open-source index — not a product API portal)
      note: >-
        "Netcracker Open Source — Qubership". Six domains listed; two live
        (API Management & Developer Portal / APIHUB, and Integration Platform / QIP),
        four "coming soon". Links out to filtered GitHub repository searches. No
        account required. No hosted API, no SDK downloads, no self-serve API keys.
