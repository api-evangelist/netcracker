actions:
  apisYmlCreated: true
  openapiHarvested: 4
  openapiDirectory: openapi/
  reason: >-
    Netcracker is a split case and both halves are recorded honestly. Its telecom
    business — the BSS/OSS and orchestration software it actually sells, and the
    TM Forum Open APIs it is certified against — is entirely partner-gated with no
    public developer portal and no downloadable specs. Its open-source Qubership
    platform is genuinely public and ships four real, parsing OpenAPI/Swagger
    contracts, which were harvested verbatim. CAMARA is named in marketing and
    implemented nowhere; that distinction is the finding, not a gap in the research.
