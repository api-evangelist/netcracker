    note: >-
      The server URL templated in the APIHUB OpenAPI (https://{apihub}.qubership.org)
      does not resolve. APIHUB is self-hosted software, not a hosted service.
  camara:
    posture: >-
      Named in product marketing as a standard the platform aligns with and can
      monetize; no CAMARA API is implemented, specified, or callable anywhere in
      Netcracker's public surface. A positioning statement, not an implementation.
    apisFound: []
    evidenceVerbatim:
    - quote: >-
        Our solutions are built on widely supported standards from TM Forum, MEF,
        3GPP, O-RAN Alliance, CAMARA and others, ensuring compatibility across
        diverse systems.
      source: https://www.netcracker.com/portfolio/products/netcracker-api-management-integration
    - quote: >-
        Netcracker's strong alignment with industry standardization organizations
        such as TM Forum, MEF, ETSI, 3GPP, CAMARA and ORAN speeds up integration
        and facilitates consistent and secure interactions across diverse ecosystems.
      source: https://www.netcracker.com/portfolio/products/netcracker-api-management-integration
    - quote: >-
        Leveraging plug and play developer APIs, such as those from CAMARA, further
        enhances the ability to gain value from APIs by simplifying access to
        valuable network assets.
      source: https://www.netcracker.com/portfolio/products/netcracker-api-management-integration
    negativeEvidence:
    - The string "camara" appears 0 times in https://www.netcracker.com/sitemap.xml.
    - No CAMARA API name (Number Verification, SIM Swap, Device Location, Device Status, Quality on Demand, Carrier Billing, KYC Match, Scam Signal, Device Swap, Population Density) appears anywhere in Netcracker's public surface.
    - GitHub search for "netcracker" across org:camaraproject returns 0 results — no issues, no PRs, no participation trail in the CAMARA repositories.
    - The one Netcracker blog post on API standardization ("APIs in Action: Using Standardization to Move Beyond Connectivity", 2025-01-14) names MEF and TM Forum and does not mention CAMARA, GSMA Open Gateway, or Aduna at all.
  openGateway:
    member: false
    note: >-
      No evidence of GSMA Open Gateway participation was found. Netcracker is a
      software vendor, not a mobile network operator, and GSMA Open Gateway is an
      operator commitment layer. No opengateway subdomain, no Open Gateway page,
      no press release found.
  aduna:
    channel: false
    note: No mention of Aduna found anywhere on netcracker.com.
  tmForum:
    conformance: claimed
    certifications:
    - name: TM Forum Platinum Badge for Open API
      source: https://www.netcracker.com/portfolio/products/netcracker-api-management-integration
      note: Stated on the product page. Specific TMF API numbers are not disclosed publicly.
    - name: ODA Compliance at "Ready for ODA" Level 6
      source: https://www.netcracker.com/portfolio/products/netcracker-api-management-integration
    - name: Ready for ODA status for the BSS/OSS portfolio
      date: '2023-12-13'
      source: https://www.netcracker.com/news/press-releases/netcracker-achieves-ready-for-oda-status-for-its-bss-oss-portfolio
      quote: Netcracker is one of the first vendors to be certified as Ready for ODA by TM Forum.
    - name: 2019 TM Forum Excellence Award for Open API adoption
      date: '2019-05-15'
      source: https://www.netcracker.com/news/press-releases/netcracker-wins-2019-tm-forum-excellence-award-for-open-api-adoption
      note: >-
        Recognized for "adopting the broadest range of TM Forum Open APIs" and for
        "contributing multiple conformance toolkits to the Open API program".
    tmfNumbersDisclosed: false
    note: >-
      This is the classic vendor pattern the sector seam predicts — real, certified
      TM Forum Open API conformance held privately, with not one TMF spec, TMF number
      or conformance certificate published where a developer could read it.
  threeGPP:
    nef: not found
    scef: not found
    note: >-
      3GPP is named as an alignment standard on the API Management product page.
      No NEF or SCEF surface, network-slicing API, or edge/MEC API is documented
      publicly. Netcracker markets 5G orchestration and NaaS solutions, but exposes
      no network-exposure API of its own.
  authModel:
    ciba: false
    cibaNote: >-
      CIBA (Client-Initiated Backchannel Authentication) does not appear anywhere.
      Netcracker exposes no CAMARA-style network authorization surface, so the
      OIDC/CIBA pattern CAMARA specifies is simply absent.
    schemesObserved:
    - spec: Qubership APIHUB Registry / Admin API
      schemes:
      - HTTP Bearer (JWT)
      - apiKey cookie (apihub-access-token)
      - apiKey header (api-key)
      - HTTP Basic
      - Personal Access Token (apiKey)
    - spec: Qubership MaaS
      schemes:
      - HTTP Basic
    - spec: Qubership DBaaS Aggregator
      schemes:
      - HTTP Bearer (JWT)
    note: >-
      Every observed scheme belongs to the self-hosted open-source platform. There
      is no Netcracker-operated authorization server; no OAuth or OIDC discovery
      document is served on netcracker.com.
