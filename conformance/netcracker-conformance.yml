source: >-
  Derived from the four harvested Qubership OpenAPI/Swagger documents, plus searched
  claims on netcracker.com (API Management product page, Cybersecurity services page) and
  TM Forum press releases.
note: >-
  Netcracker's conformance story is split. The COMMERCIAL side claims deep TM Forum Open
  API conformance (Platinum badge, Ready for ODA) but publishes no TMF specification,
  no TMF API numbers and no certificate a developer can read. The OPEN-SOURCE side
  publishes real specs, and exactly one TM Forum artifact is actually implemented in
  public: the TmfErrorResponse envelope in the DBaaS aggregator API. Everything below
  separates claimed from verified.
