note: >-
  Netcracker publishes NO client library for any commercial BSS/OSS product — those are
  partner-gated. Everything below belongs to the open-source Qubership platform. Two
  distribution facts matter: (1) the Go client libraries for MaaS and DBaaS are real,
  semver-tagged, `go get`-able modules straight from GitHub; (2) the TypeScript
  (@netcracker/*) and Java (com.netcracker.cloud.*) artifacts are published to GitHub
  Packages, NOT to npmjs.com or Maven Central — npm search "qubership" returns 0 packages,
  Maven Central search "qubership" returns 0, and the aux-tools README states plainly:
  "The repository resolves @netcracker/* packages from GitHub Packages. Configure an npm
  token with access to the organization before installing dependencies."
