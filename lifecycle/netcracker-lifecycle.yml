method: searched
source: https://netcracker.github.io/apihub/releases/
scope: Qubership APIHUB and the Qubership platform components. No lifecycle policy is published for any commercial Netcracker product.
versioning:
  api_scheme: uri-path
  api_versions_in_use: [/api/v1, /api/v2, /api/v3, /api/v4, /api/v4 (activity)]
  note: >-
    The APIHUB registry API runs four URI-path major versions side by side and marks the
    superseded operations `deprecated: true` rather than removing them (e.g. postSearch
    /api/v3/search/{searchLevel} is deprecated in favour of postSearchV4).
  product_scheme: semver
  product_current: 2.12.0
  spec_version: '2026.1'
  cadence: new releases every 4-6 weeks
  docs: https://netcracker.github.io/apihub/releases/
deprecation:
  policy_url: https://netcracker.github.io/apihub/releases/
  policy_published: false
  sunset_header: false
  deprecation_header: false
  mechanism: >-
    OpenAPI `deprecated: true` plus in-product deprecation tracking — APIHUB itself ships
    deprecated-operation summaries, per-version deprecated lists, deprecated-item detail per
    operation and an xlsx export, which is how the vendor expects deprecation to be consumed.
  in_product_operations:
  - getPackageIdVersionDeprecatedSummaryV3
  - getPackagesIdVersionsIdApiTypeDeprecations
  - getPackagesIdVersionsApiTypeOperationsIddeprecatedItems
  - getPackagesIdVersionsIdApiTypeDeprecatedOperationsExport
  note: >-
    No written deprecation/sunset policy (no notice period, no removal timeline) is published
    anywhere. What exists is the mechanism, not the promise.
