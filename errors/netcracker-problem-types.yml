agent_guidance:
  source: mcp/netcracker-mcp.yml
  rule: >-
    The apihub-mcp server instructs agents that a tool result beginning with
    "Failed to check user privileges", or stating the user lacks privileges/access, is an
    AUTHORIZATION error: stop, do not retry, do not try other packages or versions to work
    around it, and tell the user to request access. This is explicitly distinguished from
    an empty search result, which may be retried with different terms or an explicit release.
