    status: HTTP status code as an integer; expected to match the actual HTTP response status.
    code: Internal string error code. Mandatory in response.
    message: Human-readable error message for diagnostics and safe client display.
    params: Optional key/value parameters used to format or contextualize the message.
    debug: Optional debug details (stack traces); development/test only, may contain sensitive data.
