- aid: netcracker:netcracker-ai-chat-api
  name: Netcracker AI Chat API
  description: >-
    APIs for AI chat assistant.

    Each user has their own chat list; chats are persisted on the server with a configurable TTL and pinning
    support.

    Conversations support streaming responses (SSE) and automatic context compaction (old messages are
    re-packed into a summary when the conversation approaches the model's context window, so that older
    facts are preserved instead of being silently dropped by the LLM).
