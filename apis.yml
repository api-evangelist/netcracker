aid: netcracker
url: https://raw.githubusercontent.com/api-evangelist/netcracker/refs/heads/main/apis.yml
name: Netcracker
kind: company
description: >-
  Netcracker Technology is a Waltham, Massachusetts-based BSS/OSS and digital
  business software vendor and a wholly owned subsidiary of NEC Corporation.
  It sells cloud BSS, digital commerce and monetization, convergent charging,
  service and network orchestration, and API management and integration
  software to communications service providers worldwide — it is a supplier to
  carriers rather than a carrier itself, sitting one layer behind the operator
  in the telecom value chain and never touching a public developer directly.
  Netcracker is a long-standing TM Forum participant, claims the TM Forum
  Platinum Badge for Open API and "Ready for ODA" certification for its BSS/OSS
  portfolio, and contributed conformance toolkits to the TM Forum Open API
  program. Its API posture toward the outside world is honestly partner-gated:
  netcracker.com publishes no developer portal (developer., developers., docs.,
  api. subdomains do not resolve; /developer, /developers and /api all return
  404), no product OpenAPI is downloadable, and every commercial API — the
  TM Forum Open APIs its products implement — reaches integrators only through
  a customer or partner engagement. The one genuinely public, self-serve API
  surface Netcracker publishes is Qubership, its open-source cloud platform at
  github.com/Netcracker and netcracker.github.io, which ships real, downloadable
  OpenAPI contracts for its APIHUB API registry, integration, messaging and
  database services. On CAMARA, Netcracker names the standard in product
  marketing alongside TM Forum, MEF, ETSI, 3GPP and O-RAN and says CSPs can
  monetize "plug and play developer APIs, such as those from CAMARA" — but no
  CAMARA API is implemented, specified or callable anywhere in its public
  surface. That is a positioning statement, not an implementation.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
