apis:
- aid: netcracker:qubership-apihub-registry-api
  name: Qubership APIHUB Registry API
  description: >-
    The external, public-facing API contract for APIHUB — Netcracker's
    open-source API registry and developer portal product. Covers package and
    catalog operations, publication workflows, versions, export, search,
    operations and contracts, documents, change comparison, operation groups,
    integrations, roles and user profile actions. OpenAPI 3.0.3, version
    2026.1, 111 documented paths. Server URL is a self-hosted template
    (https://{apihub}.qubership.org) — qubership.org does not resolve publicly,
    so this is a spec for a platform you deploy yourself, not a hosted SaaS.
  humanURL: https://netcracker.github.io/apihub/
  baseURL: https://{apihub}.qubership.org
  tags:
  - API Management
  - API Registry
  - Developer Portal
  - Open Source
  properties:
  - type: OpenAPI
    url: openapi/netcracker-qubership-apihub-registry-openapi.yml
  - type: Documentation
    url: https://netcracker.github.io/apihub/
  - type: APIReference
    url: https://github.com/Netcracker/qubership-apihub-backend/blob/develop/docs/api/APIHUB_API.yaml
  - type: SourceCode
    url: https://github.com/Netcracker/qubership-apihub-backend
  - type: Overlay
    url: overlays/netcracker-qubership-apihub-registry-overlay.yaml
  - type: GettingStarted
    url: https://netcracker.github.io/apihub/deploy/
  - type: Postman
    url: https://github.com/Netcracker/qubership-apihub-postman-collections
- aid: netcracker:qubership-apihub-admin-api
  name: Qubership APIHUB System Administrators API
  description: >-
    The external administration API contract for APIHUB, covering technical
    administration operations — package transitions, system operations, role
    management and administrator management. OpenAPI 3.0.3, version 2026.1,
    18 documented paths. All endpoints require authenticated access and are
    intended for trusted administrative users of a self-hosted APIHUB install.
  humanURL: https://netcracker.github.io/apihub/
  baseURL: https://{apihub}.qubership.org
  tags:
  - API Management
  - Administration
  - Open Source
  properties:
  - type: OpenAPI
    url: openapi/netcracker-qubership-apihub-admin-openapi.yml
  - type: Documentation
    url: https://netcracker.github.io/apihub/
  - type: APIReference
    url: https://github.com/Netcracker/qubership-apihub-backend/blob/develop/docs/api/Admin%20API.yaml
  - type: SourceCode
    url: https://github.com/Netcracker/qubership-apihub-backend
  - type: Overlay
    url: overlays/netcracker-qubership-apihub-admin-overlay.yaml
- aid: netcracker:qubership-maas-api
  name: Qubership MaaS (Messaging as a Service) API
  description: >-
    The REST API for Qubership MaaS, Netcracker's open-source messaging-as-a-service
    component that provisions and manages Kafka topics and RabbitMQ virtual hosts
    for microservices running on the Qubership cloud platform. Swagger 2.0
    definition with 35 documented paths, secured with HTTP Basic authentication.
  humanURL: https://github.com/Netcracker/qubership-maas
  tags:
  - Messaging
  - Kafka
  - RabbitMQ
  - Open Source
  properties:
  - type: OpenAPI
    url: openapi/netcracker-qubership-maas-swagger.yml
  - type: Documentation
    url: https://github.com/Netcracker/qubership-maas
  - type: APIReference
    url: https://github.com/Netcracker/qubership-maas/blob/main/maas/maas-service/docs/swagger.yaml
  - type: SourceCode
    url: https://github.com/Netcracker/qubership-maas
  - type: Overlay
    url: overlays/netcracker-qubership-maas-overlay.yaml
  - type: SDKs
    url: packages/netcracker-packages.yml
- aid: netcracker:qubership-dbaas-aggregator-api
  name: Qubership DBaaS Aggregator API
  description: >-
    The REST API for Qubership DBaaS, Netcracker's open-source Database as a
    Service aggregator. It collects requests for managed databases and routes
    them to the appropriate database adapter, tracking every database used in a
    cloud project. OpenAPI 3.1.0, version 6.13.2, 73 documented paths covering
    database operations, users, backup and restore, balancing rules, physical
    database registration and migration. Bearer JWT authentication.
  humanURL: https://github.com/Netcracker/qubership-dbaas
  tags:
  - DBaaS
  - Database
  - Cloud Platform
  - Open Source
  properties:
  - type: OpenAPI
